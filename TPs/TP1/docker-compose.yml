version: '3.8'

services:
  backend:
    build: ./simple-api
    container_name: simple-api
    networks:
      - app-network
    depends_on:
      - database
    restart: always

  database:
    build: ./database
    container_name: database
    networks:
      - app-network
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: pwd
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always

  httpd:
    build: ./httpd
    container_name: http-server
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - backend
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  db-data: